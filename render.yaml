services:
  - type: web
    name: agriconnect-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: DB_NAME
        value: agriconnect
      - key: JWT_EXPIRY_HOURS
        value: 24
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
